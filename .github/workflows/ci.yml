name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Generate API artifacts (TypeSpec → OpenAPI → server)
        working-directory: spec
        run: npm ci && npm run generate

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Lint (ktlint)
        run: ./gradlew ktlintCheck --no-daemon --console=plain

      - name: Test
        run: ./gradlew test --no-daemon --console=plain

      - name: Build
        run: ./gradlew build --no-daemon --console=plain

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate API client (TypeSpec → OpenAPI → client)
        working-directory: spec
        run: npm ci && npm run generate

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Test (Vitest)
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: calendar
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Generate API artifacts
        working-directory: spec
        run: npm ci && npm run generate

      - name: Make Gradle wrapper executable
        working-directory: backend
        run: chmod +x ./gradlew

      - name: Start backend
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/calendar
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: nohup ./gradlew bootRun --no-daemon --console=plain > backend.log 2>&1 &

      - name: Wait for backend
        run: |
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "backend did not start"; cat backend/backend.log; exit 1

      - name: Build and start frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npm run preview -- --port 4173 > preview.log 2>&1 &

      - name: Wait for frontend
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:4173 >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "frontend did not start"; cat frontend/preview.log; exit 1

      - name: Install Playwright browsers
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:4173
        run: npm test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and start (Postgres + app via Compose)
        run: docker compose up -d --build

      - name: Wait for the app
        run: |
          for _ in $(seq 1 90); do
            if curl -sf http://localhost:9000/actuator/health >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs; exit 1

      - name: Smoke test (SPA + API on one port)
        run: |
          curl -sf http://localhost:9000/booking | grep -q 'id="root"'
          curl -sf http://localhost:9000/owner | grep -q 'id="root"'

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Playwright browsers
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run Playwright against the image
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:9000
        run: npm test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-docker
          path: e2e/playwright-report/
          retention-days: 7

      - name: Stop
        if: ${{ always() }}
        run: docker compose down
