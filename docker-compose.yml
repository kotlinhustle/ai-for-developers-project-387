name: calendar

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: calendar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 9000
      DB_URL: jdbc:postgresql://postgres:5432/calendar
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - '9000:9000'

volumes:
  postgres-data:
